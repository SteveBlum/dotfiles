# Minimal CLIProxyAPI configuration for local use (bound to localhost)
# Update values as needed before starting the service.

 # Listen on all interfaces inside the container so other services (dashboard)
 # on the Docker network can reach the management API. Compose still binds the
 # external port to 127.0.0.1 on the host, so this does not expose the service
 # publicly beyond the host machine.
host: "0.0.0.0"
port: 8317

tls:
  enable: false
  cert: ""
  key: ""

remote-management:
  # Keep management access limited to localhost.
  allow-remote: false

  # Management key. Leave empty to disable the Management API entirely.
  # If you set a plaintext value here, the server will hash it on startup.
  secret-key: ""

  disable-control-panel: false

# Authentication directory inside the container (mapped from host)
auth-dir: "/root/.cli-proxy-api"

# Local API keys (optional). Useful for programmatic access to management endpoints.
api-keys:
  - "local-test-key"

debug: false

pprof:
  enable: false
  addr: "127.0.0.1:8316"

commercial-mode: false
logging-to-file: true
logs-max-total-size-mb: 100
error-logs-max-files: 10

usage-statistics-enabled: false
proxy-url: ""
force-model-prefix: false
passthrough-headers: false
request-retry: 3
max-retry-credentials: 0
max-retry-interval: 30
disable-cooling: false

routing:
  strategy: "round-robin"
  session-affinity: false
  session-affinity-ttl: "1h"

ws-auth: false
enable-gemini-cli-endpoint: false
nonstream-keepalive-interval: 0
